<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Practica WEB</title>
</head>
<body>
    <header id="header">
        <h1>Practica WEB</h1>
    </header>
    <main id="main">
       <form action="/submit" method="get">

        <label for="name">Name:</label>
        <input type="text" id="name" name="name">

        <label for="email">Email</label>
        <input type="email" id="email" name="email">

        <label for="password">Password:</label>
        <input type="password" id="password" name="password">

        <button type="submit">Submit</button>
    </form> 

    <section class="about">
        <h2 class="about-principal">About Practica WEB</h2>

        <div class="containerImg">
            <img class="about-image" src="https://www.ionos.com/digitalguide/fileadmin/DigitalGuide/Teaser/web-development.jpg" alt="Web Development Image">
        </div>

        <p class="about-text">Practica WEB is a platform for learning web development. We offer various resources and tutorials to help you become a proficient web developer.</p>
    </section>

    </main>
    <footer id="footer">
        <p>&copy; 2024 Practica WEB. All rights reserved.</p>
    </footer> 
</body>
</html>
